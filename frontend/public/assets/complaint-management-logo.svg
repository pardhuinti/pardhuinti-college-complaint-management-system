<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Shield Emblem Icon -->
  <g transform="translate(10, 10)">
    <path d="M50 5 L90 20 V55 C90 80 50 95 50 95 C50 95 10 80 10 55 V20 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
    <!-- Inner Check Mark and Gear Accent -->
    <path d="M35 50 L45 60 L68 37" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  </g>

  <!-- Main Title Text -->
  <text x="120" y="42" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#F8FAFC" letter-spacing="1">
    COLLEGE COMPLAINT
  </text>
  <text x="120" y="68" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="url(#accentGrad)" letter-spacing="0.5">
    MANAGEMENT SYSTEM
  </text>

  <!-- Tagline Pillars -->
  <g transform="translate(120, 80)">
    <rect x="0" y="0" width="360" height="22" rx="6" fill="#1E293B" opacity="0.8"/>
    <text x="10" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#38BDF8" letter-spacing="1">RAISE</text>
    <circle cx="55" cy="11" r="2" fill="#64748B"/>
    <text x="66" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#818CF8" letter-spacing="1">TRACK</text>
    <circle cx="115" cy="11" r="2" fill="#64748B"/>
    <text x="126" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#34D399" letter-spacing="1">RESOLVE</text>
    
    <text x="235" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#94A3B8">STUDENT &amp; ADMIN</text>
  </g>
</svg>
